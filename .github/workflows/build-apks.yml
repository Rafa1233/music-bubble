name: Build Dual Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apks:
    name: Build Android 15/16+ and Android 10-14 APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies and Build Web App
        run: |
          npm install
          npm run build

      - name: Setup Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate and Patch Capacitor Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Build Both APK Flavors (Android 15/16+ and Android 10-14)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleAndroid15PlusDebug assembleAndroid10PlusDebug

      - name: Prepare Output APKs
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/android15Plus/debug/*.apk release-apks/AuraSound-Android-15-16-Plus.apk
          cp android/app/build/outputs/apk/android10Plus/debug/*.apk release-apks/AuraSound-Android-10-to-14.apk

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraSound-Dual-APKs
          path: release-apks/*.apk

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: AuraSound Android APKs (15/16+ & 10-14)
          body: |
            Unduh sesuai versi Android HP Anda agar tidak salah pasang:
            - **AuraSound-Android-15-16-Plus.apk**: Khusus Android 15 & 16+ (120Hz Native)
            - **AuraSound-Android-10-to-14.apk**: Khusus Android 10 sampai Android 14
          files: |
            release-apks/AuraSound-Android-15-16-Plus.apk
            release-apks/AuraSound-Android-10-to-14.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
